<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
  <defs>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3f5f4"/>
      <stop offset="100%" stop-color="#e9eeeb"/>
    </linearGradient>
    <pattern id="coordGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#d3dbd7" stroke-width="1"/>
    </pattern>
    <marker id="flowArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#be1e2d"/>
    </marker>
    <style>
      .title { font: 700 36px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .sub { font: 600 17px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .h { font: 700 21px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .b { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .c { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .shield { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .pt { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect width="1920" height="1200" fill="url(#sheet)"/>

  <rect x="34" y="24" width="1852" height="124" rx="12" fill="#ffffff" stroke="#b9c6bf" stroke-width="1.5"/>
  <text x="62" y="76" class="title">CROQUIS PMT - CARAVANA L.A.M.A. MEDELLIN</text>
  <text x="62" y="108" class="sub">Sabaneta, Antioquia | Trazado operativo: Calle 77 → Cra 45 → Sector Exito → Betania → Glorieta La Vaquita (2 vueltas) → Cra 43A → Calle 60 → Av. Las Vegas (N-S) → Mis Dos Potrillos</text>

  <rect x="34" y="162" width="1278" height="1002" rx="12" fill="#ffffff" stroke="#b9c6bf" stroke-width="1.5"/>
  <rect x="1334" y="162" width="552" height="1002" rx="12" fill="#ffffff" stroke="#b9c6bf" stroke-width="1.5"/>

  <rect x="58" y="206" width="1230" height="934" rx="10" fill="#eef3ef" stroke="#d4ddd7"/>
  <rect x="58" y="206" width="1230" height="934" rx="10" fill="url(#coordGrid)" opacity="0.52"/>

  <!-- Urban blocks to simulate professional basemap -->
  <g fill="#d9e2dc" stroke="#c6d2ca">
    <rect x="110" y="262" width="182" height="90" rx="6"/>
    <rect x="354" y="250" width="164" height="126" rx="6"/>
    <rect x="548" y="252" width="188" height="94" rx="6"/>
    <rect x="796" y="274" width="214" height="96" rx="6"/>
    <rect x="1128" y="270" width="128" height="102" rx="6"/>

    <rect x="120" y="432" width="172" height="112" rx="6"/>
