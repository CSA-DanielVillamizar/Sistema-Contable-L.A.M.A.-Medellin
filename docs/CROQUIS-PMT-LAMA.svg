    <rect x="372" y="616" width="168" height="124" rx="6"/>
    <rect x="790" y="618" width="220" height="94" rx="6"/>
    <rect x="1128" y="616" width="128" height="118" rx="6"/>

    <rect x="130" y="806" width="164" height="106" rx="6"/>
    <rect x="372" y="798" width="164" height="108" rx="6"/>
    <rect x="784" y="802" width="230" height="96" rx="6"/>
    <rect x="1128" y="794" width="128" height="122" rx="6"/>
  </g>

  <!-- Green zone around roundabout for map realism -->
  <circle cx="642" cy="556" r="116" fill="#dcead9" stroke="#bed2bd"/>
  <circle cx="642" cy="556" r="68" fill="#ffffff" stroke="#8ea59b" stroke-width="4"/>

