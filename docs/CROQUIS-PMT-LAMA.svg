  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="108" y1="330" x2="1172" y2="330" stroke="#f8faf9" stroke-width="16"/>
    <line x1="346" y1="252" x2="346" y2="676" stroke="#f8faf9" stroke-width="16"/>
    <line x1="784" y1="352" x2="784" y2="724" stroke="#f8faf9" stroke-width="16"/>
    <line x1="784" y1="724" x2="1084" y2="724" stroke="#f8faf9" stroke-width="16"/>
    <line x1="1084" y1="238" x2="1084" y2="1056" stroke="#f8faf9" stroke-width="18"/>

    <line x1="108" y1="330" x2="1172" y2="330" stroke="#6d7d76" stroke-width="8"/>
    <line x1="346" y1="252" x2="346" y2="676" stroke="#6d7d76" stroke-width="8"/>
    <line x1="784" y1="352" x2="784" y2="724" stroke="#6d7d76" stroke-width="8"/>
    <line x1="784" y1="724" x2="1084" y2="724" stroke="#6d7d76" stroke-width="8"/>
    <line x1="1084" y1="238" x2="1084" y2="1056" stroke="#627871" stroke-width="9"/>
  </g>

  <!-- Road shields -->
  <rect x="86" y="286" width="84" height="28" rx="6" fill="#ffffff" stroke="#aebdb5"/>
  <text x="96" y="305" class="shield">Calle 77</text>
  <rect x="300" y="220" width="70" height="28" rx="6" fill="#ffffff" stroke="#aebdb5"/>
  <text x="311" y="239" class="shield">Cra 45</text>
  <rect x="744" y="320" width="74" height="28" rx="6" fill="#ffffff" stroke="#aebdb5"/>
  <text x="752" y="339" class="shield">Cra 43A</text>
  <rect x="902" y="742" width="76" height="28" rx="6" fill="#ffffff" stroke="#aebdb5"/>
  <text x="914" y="761" class="shield">Calle 60</text>
  <rect x="1104" y="486" width="112" height="42" rx="6" fill="#ffffff" stroke="#aebdb5"/>
  <text x="1116" y="505" class="shield">Av. Las Vegas</text>
  <text x="1116" y="520" class="c">Norte-Sur</text>

  <!-- Route line with white casing for map readability -->
  <polyline points="108,330 346,330 346,462 476,462 476,536 574,536"
