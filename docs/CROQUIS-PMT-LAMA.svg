  <polyline points="108,330 346,330 346,462 476,462 476,536 574,536"
            fill="none" stroke="#be1e2d" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"
            marker-mid="url(#flowArrow)" marker-end="url(#flowArrow)"/>

  <path d="M 574 556 A 68 68 0 1 1 710 556 A 68 68 0 1 1 574 556"
        fill="none" stroke="#fffefe" stroke-width="14"/>
  <path d="M 574 556 A 68 68 0 1 1 710 556 A 68 68 0 1 1 574 556"
