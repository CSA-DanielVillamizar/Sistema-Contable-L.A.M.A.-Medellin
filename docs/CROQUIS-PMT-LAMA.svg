  <text x="944" y="1084" class="c">Calle 76B Sur #48A-105 | Llegada/Dispersión</text>

  <!-- Control points -->
  <circle cx="346" cy="330" r="22" fill="#facc15" stroke="#8a5a11" stroke-width="3"/>
  <text x="346" y="330" class="pt">A</text>
  <circle cx="642" cy="556" r="23" fill="#facc15" stroke="#8a5a11" stroke-width="3"/>
  <text x="642" y="556" class="pt">B</text>
  <circle cx="1084" cy="724" r="22" fill="#facc15" stroke="#8a5a11" stroke-width="3"/>
  <text x="1084" y="724" class="pt">C</text>
  <circle cx="1084" cy="1032" r="22" fill="#facc15" stroke="#8a5a11" stroke-width="3"/>
  <text x="1084" y="1032" class="pt">D</text>

  <!-- Map cartographic elements -->
  <g>
    <rect x="80" y="1046" width="190" height="70" rx="8" fill="#ffffff" stroke="#c3cfc8"/>
    <text x="98" y="1070" class="c">Escala grafica aprox.</text>
    <rect x="98" y="1082" width="48" height="10" fill="#111827"/>
    <rect x="146" y="1082" width="48" height="10" fill="#ffffff" stroke="#111827"/>
    <rect x="194" y="1082" width="48" height="10" fill="#111827"/>
    <text x="98" y="1108" class="c">0      100      200 m</text>
  </g>

  <g>
    <rect x="1148" y="238" width="106" height="126" rx="8" fill="#ffffff" stroke="#c3cfc8"/>
    <text x="1195" y="266" class="c" text-anchor="middle">NORTE</text>
    <line x1="1195" y1="340" x2="1195" y2="286" stroke="#111827" stroke-width="3"/>
    <polygon points="1195,274 1188,288 1202,288" fill="#111827"/>
    <line x1="1172" y1="318" x2="1218" y2="318" stroke="#64748b" stroke-width="2"/>
  </g>

  <text x="62" y="188" class="c">Base urbana referencial para lectura operativa PMT (no georreferenciada).</text>

  <!-- Right panel content -->
  <rect x="1358" y="190" width="504" height="332" rx="10" fill="#f7faf8" stroke="#cfd9d3"/>
  <text x="1384" y="230" class="h">LEYENDA Y SIMBOLOGIA</text>
  <line x1="1384" y1="272" x2="1454" y2="272" stroke="#be1e2d" stroke-width="8" marker-end="url(#flowArrow)"/>
  <text x="1474" y="277" class="b">Ruta de circulacion de la caravana.</text>

  <circle cx="1398" cy="326" r="10" fill="#facc15" stroke="#8a5a11" stroke-width="2"/>
  <text x="1420" y="331" class="b">Puntos de control con agentes y capitanes.</text>

  <circle cx="1398" cy="380" r="13" fill="none" stroke="#be1e2d" stroke-width="4"/>
  <text x="1420" y="385" class="b">Zona de exhibicion: glorieta La Vaquita.</text>

  <rect x="1384" y="408" width="456" height="90" rx="8" fill="#ffffff" stroke="#d5dfd9"/>
  <text x="1400" y="434" class="c">A: Cra 45 con Calle 77 (inicio desplazamiento)</text>
  <text x="1400" y="454" class="c">B: Glorieta La Vaquita (2 vueltas controladas)</text>
  <text x="1400" y="474" class="c">C: Av. Las Vegas con Calle 60 (alto flujo)</text>
  <text x="1400" y="494" class="c">D: Ingreso Mis Dos Potrillos (cierre)</text>

  <rect x="1358" y="542" width="504" height="278" rx="10" fill="#f7faf8" stroke="#cfd9d3"/>
  <text x="1384" y="582" class="h">CUADRO TECNICO PMT</text>
  <line x1="1384" y1="602" x2="1840" y2="602" stroke="#d6e0da"/>
  <text x="1384" y="640" class="b">Tiempo de exposicion por interseccion:</text>
  <text x="1678" y="640" class="b">Max. 2 minutos</text>
  <line x1="1384" y1="656" x2="1840" y2="656" stroke="#d6e0da"/>
  <text x="1384" y="694" class="b">Velocidad operativa:</text>
  <text x="1678" y="694" class="b">20 km/h</text>
  <line x1="1384" y1="710" x2="1840" y2="710" stroke="#d6e0da"/>
  <text x="1384" y="748" class="b">Comunicacion interna:</text>
  <text x="1678" y="748" class="b">Radio L.A.M.A.</text>
  <line x1="1384" y1="764" x2="1840" y2="764" stroke="#d6e0da"/>
  <text x="1384" y="802" class="b">Bloque movil:</text>
  <text x="1678" y="802" class="b">300 motocicletas</text>

  <rect x="1358" y="840" width="504" height="300" rx="10" fill="#f7faf8" stroke="#cfd9d3"/>
  <text x="1384" y="880" class="h">NOTAS DE RADICACION</text>
  <text x="1384" y="914" class="b">Documento: Croquis operativo para PMT.</text>
  <text x="1384" y="942" class="b">Cobertura: jurisdiccion exclusiva de Sabaneta.</text>
  <text x="1384" y="970" class="b">Finalidad: acompanamiento y seguridad vial.</text>
  <text x="1384" y="998" class="b">Validez cartografica: referencial no catastral.</text>
  <text x="1384" y="1026" class="b">Fecha de emision: ____ / ____ / ______</text>
  <text x="1384" y="1054" class="b">Responsable PMT: _____________________</text>

  <text x="1334" y="1178" class="c">Jurisdiccion exclusiva: Municipio de Sabaneta, Antioquia.</text>
</svg>
